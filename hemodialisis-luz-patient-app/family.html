<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="config.js"></script><title>Luz Familia</title><style>body{font-family:Arial;background:#edf4f1;color:#163530;margin:0;padding:20px}.card{max-width:460px;margin:30px auto;background:#fff;border-radius:16px;padding:22px;border:1px solid #d8e5e0}.stack{display:grid;gap:12px}input{padding:11px;border:1px solid #d8e5e0;border-radius:9px}button{padding:10px;border:0;border-radius:9px;background:#0f766e;color:#fff;font-weight:bold}.small{font-size:13px;color:#637873}.item{border-top:1px solid #d8e5e0;padding:10px 0}</style></head><body><main class="card"><h1>Luz Familia</h1><p class="small">Acceso de solo lectura para familiares registrados.</p><form id="login" class="stack"><input name="email" type="email" placeholder="Correo" required><input name="password" type="password" placeholder="Contraseña" required><button>Ingresar</button></form><section id="app" hidden class="stack"><h2>Vincular paciente</h2><form id="code" class="stack"><input name="code" placeholder="HS-XXXX-00" pattern="HS-[A-Z0-9]{4}-[0-9]{2}" required><button>Canjear código</button></form><h2>Pacientes vinculados</h2><div id="patients"></div><a href="index.html">Volver</a></section></main><script>
const A=(window.LUZ_PATIENT_APP_CONFIG?.apiUrl||location.origin).replace(/\/$/,''),K='luz.family.token';let t=localStorage.getItem(K)||'';
async function api(p,o={}){let r=await fetch(A+p,{...o,headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'}});if(!r.ok)throw Error((await r.json().catch(()=>({}))).message||'Error');return r.json()}
async function sessions(id,name){try{let x=await api('/family-app/patients/'+id+'/sessions');document.querySelector('#patients').innerHTML=`<button id="back">Volver a pacientes</button><h2>${name}</h2>`+(x.map(s=>`<div class="item"><b>${new Date(s.startedAt).toLocaleDateString('es-BO')}</b><br><span class="small">${s.endedAt?'Finalizada':'En curso'} · Peso: ${s.weightBefore??'—'} kg · Líquido: ${s.ultrafiltrationActualLiters??s.ultrafiltrationGoalLiters??'—'} L</span></div>`).join('')||'<p class="small">Sin sesiones registradas.</p>');document.querySelector('#back').onclick=list}catch(e){alert(e.message)}}
async function list(){let x=await api('/family-app/patients');document.querySelector('#patients').innerHTML=x.map(p=>`<div class="item"><b>${p.fullname}</b><br><span class="small">${p.age} años · ${p.patientType}</span><br><button data-session="${p.id}" data-name="${p.fullname}">Ver sesiones</button></div>`).join('')||'<p class="small">Aún no hay pacientes vinculados.</p>';document.querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>sessions(b.dataset.session,b.dataset.name))}
function show(){document.querySelector('#login').hidden=true;document.querySelector('#app').hidden=false;list().catch(e=>alert(e.message))}document.querySelector('#login').onsubmit=async e=>{e.preventDefault();try{let d=Object.fromEntries(new FormData(e.target)),r=await fetch(A+'/family-app/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok)throw Error('Credenciales incorrectas');t=(await r.json()).access_token;localStorage.setItem(K,t);show()}catch(e){alert(e.message)}};document.querySelector('#code').onsubmit=async e=>{e.preventDefault();try{await api('/family-app/link-code',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();list();alert('Paciente vinculado')}catch(e){alert(e.message)}};if(t)show()
</script></body></html>
