<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.webmanifest"><title>Luz Pacientes</title><script src="config.js"></script><style>
:root{--ink:#163530;--muted:#637873;--bg:#edf4f1;--card:#fff;--line:#d8e5e0;--a:#0f766e;--a2:#115e59;--good:#15803d;--warn:#b45309;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input{font:inherit}button{cursor:pointer}.app{max-width:720px;min-height:100vh;margin:auto;background:var(--bg)}.top{padding:20px;background:linear-gradient(135deg,var(--a),#164e63);color:#fff}.brand{font-weight:800;font-size:20px}.sub,.small{font-size:12px;color:var(--muted)}.top .sub{color:#d5f3e9}.page{padding:15px 15px 94px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 1px 4px #1635300d}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.stack{display:grid;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.metric{background:#f4f9f7;padding:10px;border-radius:12px}.metric b{display:block;font-size:20px;margin-top:2px}.primary,.secondary,.danger{border:0;border-radius:10px;padding:10px 12px;font-weight:700}.primary{background:var(--a);color:#fff}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.danger{background:#fff1f1;color:#a52020}.badge{display:inline-block;border-radius:99px;padding:4px 8px;font-size:12px;background:#dcfce7;color:#166534}.badge.warn{background:#fef3c7;color:#92400e}h1{font-size:24px;margin:0 0 6px}h2{font-size:17px;margin:0 0 7px}h3{font-size:15px;margin:0}.nav{position:fixed;bottom:0;left:0;right:0;max-width:720px;margin:auto;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 3px;z-index:4}.nav button{background:none;border:0;color:var(--muted);font-size:11px;padding:6px}.nav button.active{color:var(--a);font-weight:800}.login{min-height:100vh;padding:20px;display:grid;place-items:center;background:linear-gradient(145deg,#dcf5ed,#edf5ff)}.login .card{width:min(100%,410px);padding:25px}.field label{font-weight:700;font-size:13px}.field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;margin-top:4px}.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:7px 10px;border-radius:99px}.tabs button.active{color:#fff;background:var(--a);border-color:var(--a)}.session{border-left:4px solid var(--a)}.closed{border-left-color:#94a3b8}.chart{display:flex;align-items:end;height:100px;gap:5px}.bar{flex:1;min-width:10px;background:var(--a);border-radius:5px 5px 0 0}.article p{color:#49615b;line-height:1.5}.article[open] summary{margin-bottom:9px}.contact{border-top:1px solid var(--line);padding-top:9px}.game{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.game button{aspect-ratio:1;border:0;border-radius:12px;background:#cceee5;font-size:24px}.orb{width:170px;height:170px;display:grid;place-items:center;text-align:center;border-radius:50%;background:#99f6e4;margin:15px auto;transition:transform 4s}.orb.in{transform:scale(1.24)}.chat{max-height:320px;overflow:auto}.bubble{margin:7px 0;padding:9px;border-radius:12px;background:#f4f9f7;max-width:92%}.bubble.me{margin-left:auto;background:#ccfbf1}.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:8;background:#163530;color:#fff;padding:10px 13px;border-radius:10px}.font-sm{font-size:14px}.font-lg{font-size:18px}.hidden{display:none!important}.progress{height:8px;background:#d9e5e1;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--a)}
</style></head><body><div id="root"></div><script>
const root=document.querySelector('#root'),API=(window.LUZ_PATIENT_APP_CONFIG?.apiUrl||location.origin).replace(/\/$/,''),KEY='luz.patient.token';let token=localStorage.getItem(KEY)||'',me,status,sessions=[],evolution=[],tab='sessions',font='md',installPrompt,poll,metric='fluidRemoved',evolutionPeriod='week';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=v=>v?new Date(v).toLocaleString('es-BO',{dateStyle:'medium',timeStyle:'short'}):'—',num=(v,s='—')=>Number.isFinite(v)?v:s;
async function api(path,opt={}){let r=await fetch(API+path,{...opt,headers:{Authorization:token?'Bearer '+token:'','Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok){let e=await r.json().catch(()=>({}));throw Error(Array.isArray(e.message)?e.message.join(', '):e.message||'No se pudo completar la operación')}return r.status===204?null:r.json()}
function toast(t){let n=document.createElement('div');n.className='toast';n.textContent=t;document.body.append(n);setTimeout(()=>n.remove(),2800)}function stopPoll(){clearInterval(poll);poll=null}
function login(){stopPoll();root.innerHTML=`<main class="login"><form id="login" class="card stack"><div><div class="brand" style="color:var(--a)">Luz Pacientes</div><h1>Tu cuidado, cerca de ti</h1><p class="small">Ingresa con el correo registrado por tu centro.</p></div><div class="field"><label>Correo</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>Contraseña</label><input name="password" type="password" required autocomplete="current-password"></div><button class="primary">Ingresar</button><p class="small">Si no tienes contraseña, solicita al personal que la restablezca.</p><a href="family.html" class="small">¿Eres familiar? Ingresa aquí</a></form></main>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();try{let d=Object.fromEntries(new FormData(e.target)),r=await fetch(API+'/patient-app/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok)throw Error('Correo o contraseña incorrectos');let x=await r.json();token=x.access_token;localStorage.setItem(KEY,token);x.mustChangePassword?changePassword():load()}catch(e){toast(e.message)}}}
function changePassword(){root.innerHTML=`<main class="login"><form id="change" class="card stack"><div><div class="brand" style="color:var(--a)">Primer acceso</div><h1>Crea tu contraseña</h1><p class="small">Debes reemplazar la clave temporal antes de continuar.</p></div><div class="field"><label>Nueva contraseña</label><input name="password" type="password" minlength="8" required></div><button class="primary">Guardar y continuar</button></form></main>`;document.querySelector('#change').onsubmit=async e=>{e.preventDefault();try{await api('/patient-app/auth/change-password',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});toast('Contraseña actualizada');load()}catch(e){toast(e.message)}}}
async function load(){try{[me,status,sessions,evolution]=await Promise.all([api('/patient-app/me'),api('/patient-app/sessions/status'),api('/patient-app/sessions'),api('/patient-app/sessions/evolution/week')]);font=me.preferences?.fontSize||'md';render()}catch(e){token='';localStorage.removeItem(KEY);toast(e.message);login()}}
function shell(body){root.className='font-'+font;root.innerHTML=`<div class="app"><header class="top"><div class="row"><div><div class="brand">Luz Pacientes</div><p class="sub">Hola, ${esc(me.fullname?.split(' ')[0])}</p></div><div><button class="secondary hidden" id="install">Instalar</button> <button class="secondary" id="out">Salir</button></div></div></header><main class="page">${body}</main><nav class="nav">${[['sessions','Sesiones'],['profile','Perfil'],['care','Bienestar'],['assistant','Asistente']].map(x=>`<button data-tab="${x[0]}" class="${tab===x[0]?'active':''}">${x[1]}</button>`).join('')}</nav></div>`;document.querySelector('#out').onclick=()=>{token='';localStorage.removeItem(KEY);login()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});if(installPrompt){let b=document.querySelector('#install');b.classList.remove('hidden');b.onclick=async()=>{installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;b.remove()}}}
function sessionCard(s){let r=s.records?.at?.(-1)||s.records?.[0];return `<details class="card session ${s.endedAt?'closed':''}"><summary class="row"><div><h3>${date(s.startedAt)}</h3><span class="small">${s.endedAt?'Finalizada':'Sesión en curso'}</span></div><span class="badge ${s.reportedSymptoms?'warn':''}">${s.reportedSymptoms?'Observaciones':'Estable'}</span></summary><div class="grid"><div class="metric"><span class="small">Peso inicial</span><b>${num(s.weightBefore)} kg</b></div><div class="metric"><span class="small">Peso final</span><b>${num(s.weightAfter)} kg</b></div><div class="metric"><span class="small">Líquido retirado</span><b>${num(s.ultrafiltrationActualLiters??s.ultrafiltrationGoalLiters)} L</b></div><div class="metric"><span class="small">Presión final</span><b>${r?r.systolic+'/'+r.diastolic:'—'}</b></div></div><p class="small">Pulso: ${r?.pulse??'—'} lpm · Temperatura: ${r?.temperatureC??'—'} °C · Síntomas: ${esc(s.reportedSymptoms||'Ninguno')}</p><button class="secondary" data-pdf="${s.id}">Descargar informe PDF</button></details>`}
function sessionsView(){let a=status.activeSession,l=status.latestRecord,d=me.schedule?.durationMinutes||240,p=a?Math.min(100,Math.round((Date.now()-new Date(a.startedAt))/(d*600))):0,next=me.schedule?.nextSession?date(me.schedule.nextSession):'Sin agenda programada',labels={fluidRemoved:'Líquido retirado',weightBefore:'Peso al llegar',weightAfter:'Peso al salir',systolic:'Presión sistólica',pulse:'Pulso'};return `${a?`<section class="card session"><div class="row"><div><h2>Sesión en curso</h2><p class="small">Inició ${date(a.startedAt)} · duración programada ${d} min</p></div><span class="badge">En tratamiento</span></div><div class="progress"><i style="width:${p}%"></i></div><div class="grid" style="margin-top:10px"><div class="metric"><span class="small">Pulso</span><b>${l?.pulse??'—'} <small>lpm</small></b></div><div class="metric"><span class="small">Temperatura</span><b>${l?.temperatureC??'—'} °C</b></div><div class="metric"><span class="small">Presión</span><b>${l?l.systolic+'/'+l.diastolic:'—'}</b></div><div class="metric"><span class="small">Líquido retirado</span><b>${a.ultrafiltrationActualLiters??a.ultrafiltrationGoalLiters??'—'} L</b></div></div></section>`:`<section class="card"><h2>No tienes una sesión activa</h2><p class="small">Próxima sesión: ${next}</p></section>`}<div class="tabs"><button class="active">Historial</button><button id="month">${evolutionPeriod==='week'?'Ver mes':'Ver semana'}</button></div><section class="card"><h2>${labels[metric]} · ${evolutionPeriod==='week'?'semanal':'mensual'}</h2><div class="tabs">${Object.entries(labels).map(([key,label])=>`<button data-metric="${key}" class="${metric===key?'active':''}">${label}</button>`).join('')}</div><div class="chart">${chart(evolution)}</div></section>${sessions.map(sessionCard).join('')||'<section class="card small">Aún no hay sesiones registradas.</section>'}`}
function chart(rows){let v=rows.map(x=>x[metric]??0),m=Math.max(...v,1);return v.map(x=>`<i class="bar" style="height:${Math.max(8,x/m*90)}px" title="${x}"></i>`).join('')||'<span class="small">Sin datos suficientes.</span>'}
function contacts(){return (me.contacts||[]).map(c=>`<div class="contact stack" data-contact><div class="field"><label>Nombre</label><input name="name" value="${esc(c.name)}"></div><div class="field"><label>Parentesco</label><input name="relationship" value="${esc(c.relationship)}"></div><div class="field"><label>Teléfono</label><input name="phone" value="${esc(c.phone)}"></div><label class="small"><input type="checkbox" name="report" ${c.receivesReport?'checked':''}> Recibe informe PDF</label><button type="button" class="danger remove">Quitar</button></div>`).join('')}
function profileView(){return `<section class="card"><h1>Mi perfil</h1><form id="profile" class="stack"><div class="field"><label>Correo</label><input name="email" type="email" value="${esc(me.email)}"></div><div class="field"><label>Teléfono</label><input name="phone" value="${esc(me.phone||'')}"></div><div class="field"><label>Dirección</label><input name="address" value="${esc(me.address||'')}"></div><button class="primary">Guardar datos</button></form></section><section class="card"><div class="row"><h2>Contactos de referencia</h2><button class="secondary" id="add">Agregar</button></div><div id="contacts">${contacts()||'<p class="small">No hay contactos.</p>'}</div><button class="primary" id="saveContacts">Guardar contactos</button></section><section class="card"><h2>Tamaño de letra</h2><div class="tabs">${[['sm','Pequeño'],['md','Normal'],['lg','Grande']].map(x=>`<button data-font="${x[0]}" class="${font===x[0]?'active':''}">${x[1]}</button>`).join('')}</div></section><section class="card"><h2>Familiares con acceso</h2>${(me.familyMembers||[]).map(x=>`<div class="row contact"><span>${esc(x.fullname)}</span><button class="danger revoke" data-id="${x.id}">Revocar</button></div>`).join('')||'<p class="small">Nadie tiene acceso todavía.</p>'}<button class="secondary" id="invite">Generar código de vinculación</button></section>`}
function blankContact(){return `<div class="contact stack" data-contact><div class="field"><label>Nombre</label><input name="name"></div><div class="field"><label>Parentesco</label><input name="relationship" value="Familiar"></div><div class="field"><label>Teléfono</label><input name="phone"></div><label class="small"><input type="checkbox" name="report" checked> Recibe informe PDF</label><button type="button" class="danger remove">Quitar</button></div>`}
const articles=[['Acceso vascular','Cómo cuidar tu fístula','Tócala cada día; evita presión, extracción de sangre, peso o ropa apretada en ese brazo.'],['Acceso vascular','Si tu acceso es un catéter','Mantén el apósito seco, limpio y bien fijado; el personal debe manipularlo.'],['Líquidos','Controlar la sed entre sesiones','Usa vasos pequeños, reduce la sal y cuenta todos los líquidos.'],['Líquidos','Cómo llevar la cuenta de líquidos','Reserva la cantidad indicada por tu equipo desde la mañana.'],['Líquidos','Peso seco y ganancia','Tu equipo define el peso seco y la meta personal de ganancia.'],['Alimentación','Sal, potasio y fósforo','Sigue la pauta de nutrición individual indicada para ti.'],['Alimentación','Proteínas','Consulta a nutrición para la cantidad adecuada durante diálisis.'],['Alimentación','Cocinar rico con poca sal','Usa hierbas, limón y especias permitidas en lugar de añadir sal.'],['Alimentación','Aprende a leer las etiquetas','Revisa sodio, potasio y fósforo; nutrición puede enseñarte qué límites usar.'],['Tu sesión','Antes de venir a tu sesión','Lleva tus medicamentos y avisa si hay cambios o síntomas.'],['Tu sesión','Qué pasa durante una sesión de hemodiálisis','La máquina filtra la sangre bajo supervisión; avisa de cualquier molestia.'],['Tu sesión','Cómo hacer más llevaderas las 4 horas','Descansa, escucha música o conversa; el equipo puede orientarte si tienes incomodidad.'],['Tu sesión','Cuidados en casa después de la sesión','Levántate con calma, sigue las indicaciones y revisa tu acceso.'],['Alertas','Cuándo avisar','Sangrado, fiebre, falta de aire, dolor de pecho o desmayo requieren ayuda inmediata.'],['Alertas','Calambres y mareos durante la sesión','Avísale al personal de inmediato; no ajustes el tratamiento por tu cuenta.'],['Bienestar','Cuidar el ánimo','Hablar con tu familia y equipo puede ayudarte cuando el tratamiento pesa.'],['Bienestar','Cómo puede ayudarte tu familia','Comparte tus indicaciones y avisa a tu red de apoyo cómo ayudarte de forma concreta.'],['Bienestar','Dormir mejor','Mantén horarios regulares y comenta con tu equipo si el sueño sigue siendo difícil.'],['Bienestar','Moverte con suavidad','Pregunta a tu equipo qué movimiento es seguro para tu situación.'],['Bienestar','Piel seca y picazón','Usa crema sin perfume y comenta la picazón durante la sesión.'],['Bienestar','Infecciones y vacunas','Lava manos, cuida tu acceso y conversa con tu equipo sobre vacunas.']];
function careView(){return `<h1>Un rato para ti</h1><div class="tabs"><button class="active" data-care="articles">Artículos</button><button data-care="game">Memoria</button><button data-care="breathe">Respiración</button></div><div id="care"><div class="field"><input id="search" placeholder="Buscar un tema"></div><div class="tabs" id="cats">${['Todo','Acceso vascular','Líquidos','Alimentación','Tu sesión','Alertas','Bienestar'].map(x=>`<button data-cat="${x}">${x}</button>`).join('')}</div><div id="articleList">${articleList(articles)}</div></div>`}function articleList(a){return a.map(x=>`<details class="card article"><summary><span class="badge">${x[0]}</span><h2>${x[1]}</h2></summary><p>${x[2]} No reemplaza las indicaciones de tu médico.</p></details>`).join('')||'<p class="small">No encontré artículos.</p>'}
function assistantView(){let qs=['¿Cuánto líquido puedo tomar?','Tengo mucha sed, ¿qué hago?','¿Cómo cuido mi fístula?','¿Qué hago si me dan calambres?','¿Cuánto dura una sesión?'];return `<section class="card"><h1>Asistente</h1><p class="small">Información educativa; no reemplaza al equipo médico.</p><div id="chat" class="chat"><div class="bubble">Hola. Puedo ayudarte con dudas frecuentes de diálisis.</div></div><div class="tabs">${qs.map(q=>`<button data-q="${q}">${q}</button>`).join('')}</div><form id="ask" class="row"><input name="q" placeholder="Escribe tu pregunta" style="flex:1"><button class="primary">Enviar</button></form></section>`}
function render(){stopPoll();shell(tab==='sessions'?sessionsView():tab==='profile'?profileView():tab==='care'?careView():assistantView());if(tab==='sessions'){bindSessions();if(status.activeSession)poll=setInterval(async()=>{try{[status,sessions]=await Promise.all([api('/patient-app/sessions/status'),api('/patient-app/sessions')]);render()}catch(e){stopPoll()}},15000)}if(tab==='profile')bindProfile();if(tab==='care')bindCare();if(tab==='assistant')bindAssistant()}
function bindSessions(){document.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=async()=>{try{let r=await fetch(API+'/patient-app/sessions/'+b.dataset.pdf+'/report',{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('No se pudo generar el informe');let url=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=url;a.download='informe-sesion.pdf';a.click();URL.revokeObjectURL(url)}catch(e){toast(e.message)}});document.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>{metric=b.dataset.metric;render()});document.querySelector('#month').onclick=async()=>{try{evolutionPeriod=evolutionPeriod==='week'?'month':'week';evolution=await api('/patient-app/sessions/evolution/'+evolutionPeriod);render()}catch(e){toast(e.message)}}}
function bindProfile(){document.querySelector('#profile').onsubmit=async e=>{e.preventDefault();try{me=await api('/patient-app/me',{method:'PATCH',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});toast('Datos guardados');render()}catch(e){toast(e.message)}};document.querySelector('#add').onclick=()=>{let c=document.querySelector('#contacts');if(c.querySelectorAll('[data-contact]').length>=3)return toast('Máximo tres contactos');c.insertAdjacentHTML('beforeend',blankContact())};document.querySelector('#contacts').onclick=e=>{if(e.target.classList.contains('remove'))e.target.closest('[data-contact]').remove()};document.querySelector('#saveContacts').onclick=async()=>{let c=[...document.querySelectorAll('[data-contact]')].map((x,i)=>({id:'contact-'+i,name:x.querySelector('[name=name]').value,relationship:x.querySelector('[name=relationship]').value,phone:x.querySelector('[name=phone]').value,receivesReport:x.querySelector('[name=report]').checked}));try{me=await api('/patient-app/me/contacts',{method:'PATCH',body:JSON.stringify({contacts:c})});toast('Contactos guardados')}catch(e){toast(e.message)}};document.querySelectorAll('[data-font]').forEach(b=>b.onclick=async()=>{try{me=await api('/patient-app/me/preferences',{method:'PATCH',body:JSON.stringify({fontSize:b.dataset.font})});font=me.preferences.fontSize;render()}catch(e){toast(e.message)}});document.querySelectorAll('.revoke').forEach(b=>b.onclick=async()=>{if(!confirm('¿Revocar este acceso?'))return;try{me=await api('/patient-app/me/family/'+b.dataset.id,{method:'DELETE'});toast('Acceso revocado');render()}catch(e){toast(e.message)}});document.querySelector('#invite').onclick=async()=>{try{let r=await api('/patient-app/me/family-invite',{method:'POST'});await navigator.clipboard?.writeText(r.code);toast('Código '+r.code+' copiado; vence '+date(r.expiresAt))}catch(e){toast(e.message)}}}
function bindCare(){let list=document.querySelector('#articleList'),draw=(q='',cat='Todo')=>list.innerHTML=articleList(articles.filter(a=>(cat==='Todo'||a[0]===cat)&&a.join(' ').toLowerCase().includes(q.toLowerCase())));document.querySelector('#search').oninput=e=>draw(e.target.value);document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>draw(document.querySelector('#search').value,b.dataset.cat));document.querySelectorAll('[data-care]').forEach(b=>b.onclick=()=>{let host=document.querySelector('#care');if(b.dataset.care==='game'){let deck=['♥','●','▲','★','♥','●','▲','★'].sort(()=>Math.random()-.5),open=[],matched=[];host.innerHTML=`<section class="card"><h2>Memoria de parejas</h2><button class="secondary" id="newGame">Nueva partida</button><div class="game" id="game">${deck.map((_,i)=>`<button data-i="${i}">?</button>`).join('')}</div><p class="small" id="score"></p></section>`;let click=e=>{let i=+e.target.dataset.i;if(open.includes(i)||matched.includes(i)||open.length===2)return;e.target.textContent=deck[i];open.push(i);if(open.length===2){setTimeout(()=>{if(deck[open[0]]===deck[open[1]])matched.push(...open);else open.forEach(j=>document.querySelector('[data-i="'+j+'"]').textContent='?');open=[];document.querySelector('#score').textContent=matched.length===8?'¡Completaste el juego!':''},550)}};document.querySelectorAll('[data-i]').forEach(x=>x.onclick=click);document.querySelector('#newGame').onclick=()=>{tab='care';render();setTimeout(()=>document.querySelector('[data-care="game"]').click(),0)}}else if(b.dataset.care==='breathe'){host.innerHTML='<section class="card" style="text-align:center"><h2>Respiración guiada</h2><div id="orb" class="orb">Listo</div><button id="breath" class="primary">Comenzar</button></section>';let t,on=false,inhale=true,step=()=>{let o=document.querySelector('#orb');o.classList.toggle('in',inhale);o.innerHTML=inhale?'Inhala<br>4 segundos':'Exhala<br>6 segundos';t=setTimeout(()=>{inhale=!inhale;if(on)step()},inhale?4000:6000)};document.querySelector('#breath').onclick=e=>{on=!on;e.target.textContent=on?'Detener':'Comenzar';if(on){inhale=true;step()}else{clearTimeout(t);document.querySelector('#orb').classList.remove('in');document.querySelector('#orb').textContent='Listo'}}}})}
function bindAssistant(){let ask=q=>{let low=q.toLowerCase(),a=/dolor.*pecho|falta.*aire|sangr|desmay|fiebre alta/.test(low)?'Esto puede ser una emergencia. Contacta ahora a tu unidad o a emergencias; si estás en sesión avisa al personal.':/medic|dosis|pastilla/.test(low)?'No puedo indicar dosis ni cambiar tratamientos. Consulta a tu médico o enfermería.':/líquido|agua|sed/.test(low)?'La cantidad la define tu equipo. Cuenta todo líquido y reduce sal para ayudar con la sed.':/fístula|acceso/.test(low)?'Revisa su vibración, evita presión en ese brazo y avisa si hay dolor, enrojecimiento o deja de vibrar.':/calambre/.test(low)?'Si ocurre durante la sesión avisa al personal de inmediato; pueden revisar la retirada de líquido.':'No tengo una respuesta específica. Consulta a tu equipo de diálisis.';document.querySelector('#chat').insertAdjacentHTML('beforeend',`<div class="bubble me">${esc(q)}</div><div class="bubble">${a}</div>`)};document.querySelector('#ask').onsubmit=e=>{e.preventDefault();let q=e.target.q.value.trim();if(q){ask(q);e.target.reset()}};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q))}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;if(token)render()});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');token?load():login();
</script></body></html>
